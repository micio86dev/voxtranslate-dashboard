name: CI

on:
  push:
    # `develop` is here because merging a feature into it triggers the staging deploy:
    # without it, integration reached staging with no gate at all, and a red build only
    # surfaced later on the release push to main.
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
