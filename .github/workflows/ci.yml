name: CI

on:
  push:
    # `develop` is here because merging a feature into it triggers the staging deploy:
    # without it, integration reached staging with no gate at all, and a red build only
    # surfaced later on the release push to main.
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      # Browser tests for the dialer (spec 0111). The API is stubbed at the network
      # boundary, so this needs no backend, no database and no telephony provider — it
      # runs in seconds and gates every push. `--only-shell` because these specs never
      # need a headed browser and the full download is ~5x the size.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
